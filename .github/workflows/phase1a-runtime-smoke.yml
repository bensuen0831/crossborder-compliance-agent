name: phase1a-runtime-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "smoke/**"
      - "scripts/**"
      - "tests/**"
      - "alembic/**"
      - "pyproject.toml"
      - "ARCHITECTURE_RULES.md"
      - "*.md"
      - "evidence/**"
      - ".github/workflows/phase1a-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Contract/static test subset
        run: pytest -q -m "not runtime_smoke"
      - name: Architecture rules
        run: python scripts/architecture_rule_check.py

  mandatory-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U compliance -d compliance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: LOCAL_SERVER
      DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/compliance
      LANGGRAPH_DATABASE_URI: postgresql://compliance:compliance@localhost:5432/compliance?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      LANGGRAPH_STRICT_MSGPACK: "true"
      SMOKE_STATE_FILE: /tmp/phase1a_smoke_ids.json
      EVIDENCE_DIR: artifacts/phase1a-runtime
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run mandatory PostgreSQL-backed LangGraph gate
        run: bash smoke/run_gate.sh
      - name: Upload empirical Phase 1A.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/phase1a-runtime/
          if-no-files-found: error
          retention-days: 30
